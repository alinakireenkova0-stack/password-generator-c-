name: C++ Code Check

on:
  pull_request:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install g++
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Compile main.cpp
        run: g++ -c main.cpp -o main.o
